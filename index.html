<!DOCTYPE html>
<html lang="en" data-arcade-game="hub">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roguelike Arcade</title>
<meta name="description" content="Three roguelites, one account, one set of leaderboards.">
<meta name="color-scheme" content="dark">
<link rel="stylesheet" href="shared/css/arcade.css">
<style>
/* The hub is built almost entirely out of the shared design system; only the
   page-level layout lives here. */
html, body { height: 100%; }
body {
  margin: 0;
  font-family: var(--ac-font-ui);
  color: var(--ac-ink);
  background:
    radial-gradient(900px 520px at 50% -12%, #1b2637 0%, var(--ac-surface-0) 62%);
  min-height: 100%;
}
.wrap { max-width: 1040px; margin: 0 auto; padding: 60px var(--ac-s5) var(--ac-s6); }

header.hero { text-align: center; margin-bottom: var(--ac-s6); }
.hero__mark {
  display: inline-flex; align-items: center; gap: 10px;
  color: var(--ac-gold);
  font-size: var(--ac-fs-micro);
  letter-spacing: var(--ac-track-caps);
  text-transform: uppercase;
  margin-bottom: var(--ac-s3);
}
.hero__mark i { width: 10px; height: 10px; background: var(--ac-gold); transform: rotate(45deg); border-radius: 1px; }
.hero h1 {
  margin: 0;
  font-size: var(--ac-fs-display);
  letter-spacing: .22em;
  text-transform: uppercase;
  font-weight: 800;
}
.hero p { margin: var(--ac-s3) auto 0; max-width: 540px; color: var(--ac-ink-dim); font-size: var(--ac-fs-md); line-height: 1.7; }

.games { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: var(--ac-s4); }

.game {
  display: flex;
  flex-direction: column;
  padding: var(--ac-s5);
  text-decoration: none;
  color: inherit;
  transition: transform var(--ac-fast), border-color var(--ac-fast);
}
.game:hover { transform: translateY(-3px); border-color: var(--ac-gold); }
.game__top { display: flex; align-items: center; gap: var(--ac-s3); margin-bottom: var(--ac-s4); }
.game__glyph {
  width: 44px; height: 44px; flex: none;
  display: grid; place-items: center;
  font-size: 22px;
  border-radius: var(--ac-r-md);
  background: var(--ac-surface-3);
  border: 1px solid var(--ac-line);
}
.game__name { font-size: var(--ac-fs-lg); font-weight: 800; letter-spacing: .06em; }
.game__tag { font-size: var(--ac-fs-micro); letter-spacing: var(--ac-track-caps); text-transform: uppercase; color: var(--ac-ink-dim); }
.game__board { flex: 1; }
.game__foot { margin-top: var(--ac-s4); }

footer.note { margin-top: var(--ac-s6); text-align: center; }
</style>
</head>
<body class="ac-root">

<div class="wrap">
  <header class="hero">
    <div class="hero__mark"><i></i><span>Roguelike Arcade</span></div>
    <h1>Three runs, one account</h1>
    <p>
      A plinko board, a bag of dice and a roulette wheel — three different games that
      share one design language, one sign-in and one set of leaderboards. Beat your
      best in any of them and it shows up here.
    </p>
  </header>

  <main class="games" id="games"></main>

  <footer class="note ac-note" id="note"></footer>
</div>

<script src="shared/js/arcade-config.js"></script>
<script src="shared/js/arcade-auth.js"></script>
<script src="shared/js/arcade-scores.js"></script>
<script src="shared/js/arcade-catalogue.js"></script>
<script src="shared/js/arcade-progress.js"></script>
<script src="shared/js/arcade-dealer.js"></script>
<script src="shared/js/arcade-ui.js"></script>
<script src="shared/js/arcade-broker.js"></script>
<script src="shared/js/arcade.js"></script>
<script>
(function () {
  'use strict';

  // Deployed, the hub is its own site and the games are absolute URLs. Browsed
  // locally from the arcade root, they are siblings of this folder.
  Arcade.init({ gameId: null, rootPath: '../' });

  var host = document.getElementById('games');

  function card(game) {
    var a = document.createElement('a');
    a.className = 'ac-panel game';
    a.href = Arcade.gameUrl(game);

    var top = document.createElement('div');
    top.className = 'game__top';
    var glyph = document.createElement('div');
    glyph.className = 'game__glyph';
    glyph.textContent = game.glyph;
    top.appendChild(glyph);
    var names = document.createElement('div');
    var n = document.createElement('div');
    n.className = 'game__name';
    n.textContent = game.name;
    var t = document.createElement('div');
    t.className = 'game__tag';
    t.textContent = game.tagline;
    names.appendChild(n);
    names.appendChild(t);
    top.appendChild(names);
    a.appendChild(top);

    var board = document.createElement('div');
    board.className = 'game__board';
    board.innerHTML = '<div class="ac-spinner"></div>';
    a.appendChild(board);

    var foot = document.createElement('div');
    foot.className = 'game__foot';
    var btn = document.createElement('span');
    btn.className = 'ac-btn ac-btn--primary ac-btn--block';
    btn.textContent = 'Play ' + game.name;
    foot.appendChild(btn);
    a.appendChild(foot);

    host.appendChild(a);
    return board;
  }

  function rows(board, data, game) {
    board.innerHTML = '';
    var head = document.createElement('div');
    head.className = 'ac-lb__head';
    head.innerHTML = '<span>#</span><span>Top ' + Arcade.options.topN +
      '</span><span>' + Arcade.primaryMetric(game).label + '</span>';
    board.appendChild(head);

    var list = document.createElement('div');
    list.className = 'ac-lb';

    if (data.offline) {
      list.innerHTML = '<div class="ac-lb__empty">Leaderboards are offline.<br>' +
        'Add a Firebase config to switch them on.</div>';
    } else if (data.error) {
      list.innerHTML = '<div class="ac-lb__empty">' + data.error + '</div>';
    } else if (!data.rows.length) {
      list.innerHTML = '<div class="ac-lb__empty">No scores posted yet.</div>';
    } else {
      data.rows.forEach(function (r) {
        var row = document.createElement('div');
        row.className = 'ac-lb__row ac-lb__row--' + r.rank + (r.you ? ' ac-lb__row--you' : '');
        var name = r.name + (r.you ? ' (you)' : '');
        row.innerHTML = '<span class="ac-lb__rank">' + r.rank + '</span>' +
          '<span class="ac-lb__name"></span>' +
          '<span class="ac-lb__score">' + Arcade.ui.fmt(r.score) + '</span>';
        row.children[1].textContent = name;
        list.appendChild(row);
      });
    }
    board.appendChild(list);

    if (data.you && !data.youInTop) {
      var you = document.createElement('div');
      you.className = 'ac-standing';
      you.innerHTML = '<div class="ac-lb__gap">···</div>' +
        '<div class="ac-lb__row ac-lb__row--you">' +
        '<span class="ac-lb__rank">' + Arcade.ui.rankText(data.you.rank).replace('#', '') + '</span>' +
        '<span class="ac-lb__name"></span>' +
        '<span class="ac-lb__score">' + Arcade.ui.fmt(data.you.score) + '</span></div>';
      you.querySelector('.ac-lb__name').textContent = data.you.name + ' (you)';
      board.appendChild(you);
    }
  }

  var boards = Arcade.games.map(function (g) { return { game: g, node: card(g) }; });

  function load() {
    boards.forEach(function (b) {
      Arcade.scores.board(b.game.id).then(function (data) { rows(b.node, data, b.game); });
    });
  }

  // Redraw when the player signs in or out: their own standing changes.
  Arcade.auth.onChange(function (st) {
    if (st.status === 'connecting') return;
    load();
  });
  load();

  var note = document.getElementById('note');
  function setNote() {
    note.textContent = !Arcade.isConfigured()
      ? 'Accounts and leaderboards are not configured yet — every game still plays offline. See ARCADE.md.'
      : Arcade.auth.isSignedIn()
        ? 'Signed in as ' + Arcade.auth.displayName() + '. The same account works in every game.'
        : 'Sign in from any game — or the button up there — and your scores follow you across all three.';
  }
  Arcade.auth.onChange(setNote);
  setNote();

  // He greets once the session is known, so he can tell a regular from a
  // stranger rather than guessing while the broker is still connecting.
  Arcade.auth.ready().then(function () {
    if (!Arcade.dealer) return;
    var seen = false;
    try { seen = localStorage.getItem('arcade.seen') === '1'; localStorage.setItem('arcade.seen', '1'); }
    catch (e) { seen = true; }
    Arcade.dealer.says(!seen ? 'hub_first'
      : Arcade.auth.isSignedIn() ? 'hub' : 'hub_signed_out');
  });
})();
</script>
</body>
</html>
